name: Pitch tracker

on:
  schedule:
    - cron: "17 22 * * 1-5"   # weekdays, after the US close
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prices and update data/pitches.json
        run: python3 scripts/update_pitches.py
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data/pitches.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/pitches.json
            git commit -m "Update pitch tracker data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # pushes made with the workflow token do not always start a Pages build, so request one
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
