name: Pitch tracker

on:
  schedule:
    - cron: "17 22 * * 1-5"   # weekdays, after the US close
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prices and update data/pitches.json
        run: python3 scripts/update_pitches.py
      # the push below starts the normal GitHub Pages rebuild on its own
      - name: Commit if changed
        run: |
          if ! git diff --quiet -- data/pitches.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/pitches.json
            git commit -m "Update pitch tracker data"
            git push
          fi
